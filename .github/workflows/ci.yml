name: CI – Test e Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codice
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Installa dipendenze
        run: npm ci

      - name: Lint
        run: npm run lint || echo "Lint non configurato"

      - name: Test
        run: npm test || echo "Nessun test configurato"

      - name: Test privacy geolocalizzazione
        run: npm run privacy:test
