name: Security remediation 2026

on:
  push:
    branches:
      - security/remediate-tar-2026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remediate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Regenerate lockfile with security overrides
        run: npm install --package-lock-only --ignore-scripts
      - name: Install exact tree
        run: npm ci --ignore-scripts
      - name: Run tests
        run: |
          npm test
          npm run privacy:test
      - name: Audit exact tree
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); const v=a.metadata?.vulnerabilities||{}; console.log(v); if ((v.critical||0)>0) process.exit(2)"
      - name: Verify tar version
        run: npm ls tar --all
      - name: Upload remediation evidence
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-remediation-evidence
          path: |
            package-lock.json
            npm-audit.json
