name: Security HIGH Remediation

on:
  push:
    branches: [security/marketplace-high-safe-remediation]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/marketplace-high-safe-remediation
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Regenerate exact lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install
        run: npm ci --ignore-scripts
      - name: Tests
        run: |
          npm test
          npm run privacy:test
      - name: Audit and verify patched packages
        run: |
          npm audit --json > npm-audit.json || true
          npm ls ws ip-address --all
          node - <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('npm-audit.json','utf8'));
          const v=a.metadata?.vulnerabilities||{};
          console.log(v);
          if ((v.critical||0)>0) process.exit(1);
          NODE
      - name: Persist lockfile if changed
        run: |
          if ! git diff --quiet package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "security: refresh lockfile for patched overrides"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: marketplace-high-remediation-evidence
          path: |
            package-lock.json
            npm-audit.json
