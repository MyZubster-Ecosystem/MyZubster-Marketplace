name: MYZ cross-repo contract

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'models/**'
      - 'routes/**'
      - 'tests/myzCrossRepo.contract.test.js'
      - '.github/workflows/myz-cross-repo-contract.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/**'
      - 'models/**'
      - 'routes/**'
      - 'tests/myzCrossRepo.contract.test.js'
      - '.github/workflows/myz-cross-repo-contract.yml'
  workflow_dispatch:
    inputs:
      core_ref:
        description: 'Core myzubster ref to test against'
        required: false
        default: 'main'

permissions:
  contents: read

concurrency:
  group: myz-cross-repo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Marketplace
        uses: actions/checkout@v4

      - name: Checkout canonical core MYZ ledger
        uses: actions/checkout@v4
        with:
          repository: MyZubster-Ecosystem/myzubster
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.core_ref || 'main' }}
          path: core-myzubster

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Marketplace dependencies
        run: npm ci

      - name: Install core dependencies
        working-directory: core-myzubster
        run: npm ci

      - name: Run core MYZ ledger contract tests
        working-directory: core-myzubster
        run: npx jest tests/myzLedgerApiService.test.js tests/myzLedgerApiRoutes.test.js --runInBand

      - name: Run MYZ cross-repo vertical slice
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/myzubster_cross_repo_contract
          MYZ_CORE_DIR: ${{ github.workspace }}/core-myzubster
        run: node --test tests/myzCrossRepo.contract.test.js
